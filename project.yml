name: PrehabExercises
options:
  bundleIdPrefix: com.prehab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  PrehabExercises:
    type: application
    platform: iOS
    sources:
      - path: PrehabExercises
    info:
      path: PrehabExercises/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prehab.exercises
        PRODUCT_NAME: Prehab Exercises
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
